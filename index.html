<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Contato - Semântico</title>
</head>
<body>
    <main>
        <section>
            <header>
                <h2>Cadastrar Novo Cadastro</h2>
                <p>Preencha os dados abaixo para adicionar um contato á sua agenda.</p>
            </header>

            <form action="/salvar-contato" method="POST">
                <!--Agrupamento Semântico 1: Identificação-->
                
                <fieldset>
                    <legend>Identificação Pessoal</legend>
                    <p>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" autocomplete="primeiro-nome" required>
                    </p>

                    <p><label for="nome">Sobrenome:</label>
                        <input type="text" id="sobrenome" name="sobrenome" autocomplete="sobrenome" required>
                    </p>
                </fieldset>

                <!-- Agrupamento Semântico 2: Contato e Localização-->
                 <fieldset>
                    <legend>Contato e Localização</legend>
<!--primeiro paragrafo (email)-->
                    <p>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" autocomplete="email" required placeholder="exemplo@dominio.com">
                    </p>
<!--segundo paragrafo (telefone)-->
                    <p>
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" pattern="\(d{2}\)\d{5}-\d{4}" placeholder="(xx)xxxxx-xxxx" title="O formato deve ser (xx)xxxxx-xxxx" autocomplete="codigo-area" required>
                    </p>
                    <!--terceiro paragrafo (cidade)-->
                    <p>
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" autocomplete="endereco-cidade" required>
                    </p>
<!--quarto paragrafo (estados)-->
                    <p>
                        <label for="estado">Estados:</label>
                        <select id="estado" name="estado" autocomplete="endereco-estado" required>
                            <option value="">Selecione um estado...</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal
                            </option>
                        </select>
                    </p>
                        </fieldset>
                        <br>
<!--botão de confirmação-->
                        <button type="submit">Salvar Cadastro</button>
                 
            </form>
        </section>
    </main>
</body>
</html>
